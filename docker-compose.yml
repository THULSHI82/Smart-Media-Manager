services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    command: gunicorn -b 0.0.0.0:5001 'app:create_app()'
    env_file: ./backend/.env
    ports:
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A celery_app.celery worker --loglevel=info
    env_file: ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    depends_on:
      - redis

volumes:
  redis_data:
